---
# Calamares shellprocess module configuration.
# Runs parishbsd-postinstall.sh inside the target chroot after unpackfs
# has copied the filesystem and before umount.
#
# dontChroot: false  ->  run inside the target root, not the live system
# timeout:    300    ->  five minutes is enough for user creation,
#                        sysrc, and theme detection.
# script:     absolute path inside the target root

dontChroot: false
timeout: 300
script:
  - "/usr/local/etc/scripts/parishbsd-postinstall.sh"