unpack:
  - source: "/ro-root"
    sourcefs: "file"
    destination: ""
    exclude:
      - "dev/*"
      - "proc/*"
      - "sys/*"
      - "tmp/*"
      - "var/tmp/*"
      - "var/cache/*"
      - "var/run/*"
      - "var/log/*"
      - "ro-root/*"
      - "cdrom/*"
      - "live/*"
      - "home/live/*"
      - "usr/local/etc/calamares/*"