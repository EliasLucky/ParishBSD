# ParishBSD: notify the desktop when USB storage is attached.
# The device is NOT mounted automatically  the user chooses a jail
# via the Container Manager.

notify 100 {
    match "system" "GEOM";
    match "subsystem" "DEV";
    match "type" "ATTACH";
    action "/usr/local/parishbsd/scripts/parish-usb-notify attach $cdev";
};

notify 100 {
    match "system" "GEOM";
    match "subsystem" "DEV";
    match "type" "DETACH";
    action "/usr/local/parishbsd/scripts/parish-usb-notify detach $cdev";
};