# ParishBSD host defaults.
hostname="parishbsd"
keymap="us.kbd"
dumpdev="AUTO"

# Networking: DHCP on the first wired interface; the installer overrides.
ifconfig_DEFAULT="DHCP"
defaultrouter=""
resolvconf_enable="YES"

# Services
dbus_enable="YES"
lightdm_enable="YES"
parish_guardian_enable="YES"
parishbsd_vaults_enable="YES"
pf_enable="YES"
pflog_enable="YES"
devfs_enable="YES"