# ISO boot configuration.
autoboot_delay="5"
beastie_disable="YES"
boot_mute="YES"
splash="/boot/images/parishbsd-logo.png"
shutdown_splash="/boot/images/parishbsd-logo.png"

# Live environment: load the mfsroot that mounts the uzip root.
mfsroot_load="YES"
mfsroot_type="mfs_root"
mfsroot_name="/boot/mfsroot.gz"

# Needed by the live init.
geom_uzip_load="YES"
tmpfs_load="YES"