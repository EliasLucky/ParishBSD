# build.conf - ParishBSD build configuration.
# Sourced by build.sh and every phase.

# ---- FreeBSD base ---------------------------------------------------------
FREEBSD_VERSION="15.1-RELEASE"
FREEBSD_MIRROR="https://download.freebsd.org/releases/amd64/${FREEBSD_VERSION}"

# ---- Layout ---------------------------------------------------------------
POOL_NAME="parishbsd-build"
POOL_SIZE="12g"                     # mdconfig-backed ZFS pool
BUILD_DIR="${PARISHBSD_BUILD_DIR:-${HOME}/parishbsd-build}"
ROOT="${BUILD_DIR}/root"            # chroot / ISO root tree
OUT="${BUILD_DIR}/out"              # final artifacts
STAGE="${BUILD_DIR}/stage"          # ISO assembly tree
CACHE="${BUILD_DIR}/cache"          # base.txz etc. (survives --clean-pool)

# ---- ISO ------------------------------------------------------------------
ISO_LABEL="PARISHBSD_INSTALL"
ISO_PUBLISHER="ParishBSD Project"
ISO_VOLID="PARISHBSD"
ISO_NAME="ParishBSD-${VERSION}-amd64.iso"

# ---- Signing --------------------------------------------------------------
# The signing key is NOT in the repo. Set PARISHBSD_SIGNING_KEY to a GPG
# key ID or fingerprint before running build.sh --sign.
SIGNING_KEY="${PARISHBSD_SIGNING_KEY:-}"

# ---- Packages -------------------------------------------------------------
# Source of parishbsd-* packages. If unset or missing, build.sh clones
# PARISHBSD_PORTS_REPO into $BUILD_DIR/parishbsd-ports.
PARISHBSD_PORTS_DIR="${PARISHBSD_PORTS_DIR:-}"
PARISHBSD_PORTS_REPO="https://codeberg.org/EliasLucky/parishbsd-ports"
PARISHBSD_PORTS_BRANCH="main"

# Optional: a remote pkg repo for parishbsd-* packages. If set, the build
# skips local package compilation and points pkg at this URL.
PARISHBSD_PKG_REPO="${PARISHBSD_PKG_REPO:-}"

# ---- Live environment -----------------------------------------------------
MFSROOT_SIZE="32m"
UZIP_BLOCK_SIZE="65536"             # mkuzip -s
UZIP_COMPRESS="zstd"                # mkuzip -A; zstd|zlib|none